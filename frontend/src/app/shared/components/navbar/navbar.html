<nav class="fixed inset-x-0 top-0 z-50 border-b border-[#edeff5] bg-white/85 backdrop-blur-md">
  <div class="flex h-14 w-full items-center justify-between px-4 md:px-8">

    <div class="nav-left">
      <button
        type="button"
        (click)="onLogoClick()"
        [title]="isLoggedIn ? 'Se déconnecter' : `Retour à l'accueil`"
        [attr.aria-label]="isLoggedIn ? 'LOGIQA - Se déconnecter' : `LOGIQA - Retour à l'accueil`"
        class="logo flex items-center gap-2.5 text-left">
        <img class="h-9 w-auto" src="logo-mark.png" alt="" />
        <span class="flex flex-col leading-none">
          <strong class="text-[17px] font-extrabold tracking-tight text-[#101828]">LOGIQA</strong>
          <small class="mt-[3px] text-[9px] font-bold uppercase tracking-[0.18em] text-[#98a2b3]">Plateforme E-Learning</small>
        </span>
      </button>
    </div>

    <div class="nav-right">
      <div class="dropdown relative">
        <button
          class="inline-flex items-center gap-2 rounded-full border border-[#edeff5] bg-white px-4 py-2 text-[13px] font-semibold text-[#344054] shadow-[0_2px_10px_-4px_rgba(16,24,40,0.12)] transition hover:border-[#6366f1]/45 hover:text-[#4f46e5]"
          (click)="toggleDropdown($event)">
          Menu
          <svg
            class="h-3.5 w-3.5 transition-transform duration-200"
            [class.rotate-180]="isDropdownOpen"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        <ul
          class="menu-pop absolute right-0 top-[calc(100%+10px)] z-50 w-[236px] list-none rounded-2xl border border-[#edeff5] bg-white p-2 shadow-[0_24px_48px_-16px_rgba(16,24,40,0.22)]"
          *ngIf="isDropdownOpen">

          <ng-container *ngIf="!isLoggedIn">
            <li>
              <a routerLink="/login" (click)="closeDropdown()" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                  <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                Login
              </a>
            </li>
            <li>
              <a routerLink="/inscription" (click)="closeDropdown()" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <line x1="19" y1="8" x2="19" y2="14" />
                  <line x1="22" y1="11" x2="16" y2="11" />
                </svg>
                Sign up
              </a>
            </li>
            <li class="my-1.5 h-px bg-[#edeff5]"></li>
          </ng-container>

          <ng-container *ngIf="isLoggedIn">
            <!-- Identité de l'utilisateur -->
            <li class="menu-user-card" *ngIf="userLabel">
              <span class="menu-user-name">{{ userLabel }}</span>
              <span class="menu-user-role">{{ userRole }}</span>
            </li>
            <li>
              <a [routerLink]="espaceLink" (click)="closeDropdown()" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7" rx="1.5" />
                  <rect x="14" y="3" width="7" height="7" rx="1.5" />
                  <rect x="3" y="14" width="7" height="7" rx="1.5" />
                  <rect x="14" y="14" width="7" height="7" rx="1.5" />
                </svg>
                Mon espace
              </a>
            </li>
            <li>
              <a routerLink="/profil" (click)="closeDropdown()" class="menu-item">
                <i class="bi bi-person text-[15px]" aria-hidden="true"></i>
                Mon profil
              </a>
            </li>
            <li class="my-1.5 h-px bg-[#edeff5]"></li>
          </ng-container>

          <li>
            <a routerLink="/about-us" (click)="closeDropdown()" class="menu-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <path d="M12 16v-4" />
                <path d="M12 8h.01" />
              </svg>
              About us
            </a>
          </li>

          <li *ngIf="isLoggedIn" class="menu-logout-item">
            <button class="menu-item menu-item--danger" (click)="logout()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              Déconnexion
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Fenêtre de confirmation affichée avant la déconnexion (clic sur le logo) -->
<app-logout-confirm
  *ngIf="showLogoutConfirm"
  (confirmed)="confirmLogout()"
  (cancelled)="showLogoutConfirm = false"></app-logout-confirm>
