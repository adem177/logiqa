<section class="hero">
  <div class="hero-content">
    <div class="text-content">
      <h1>{{ slides[currentSlide].title }}</h1>
      <h2>{{ slides[currentSlide].subtitle }}</h2>
      <h3>{{ slides[currentSlide].description }}</h3>
      <p>{{ slides[currentSlide].detail }}</p>
      <button class="btn-start" routerLink="/inscription">start now</button>

    <div class="image-content">
      <img src="ima.jpg" alt="Logiqa" class="hero-logo" />
      <div class="bg-shape"></div>
    </div>
  </div>
</section>
