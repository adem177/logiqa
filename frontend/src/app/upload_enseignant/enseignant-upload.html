<div class="upload-page">
  <header class="upload-header">
    <h1>Publier un nouveau cours</h1>
    <p>Remplissez les informations et déposez vos supports pédagogiques (Vidéos, PDF).</p>
  </header>

  <form (ngSubmit)="submitCourse()" class="upload-form">

    <!-- METADONNÉES DU COURS -->
    <section class="form-card">

      <div class="form-group">
        <label for="courseSubject">Matière *</label>
        <select
          id="courseSubject"
          [ngModel]="courseSubject()"
          (ngModelChange)="courseSubject.set($event); onSubjectChange()"
          name="courseSubject"
          required
        >
          <option value="" disabled selected>Sélectionner une matière</option>
          @for (subject of subjects; track subject.value) {
            <option [value]="subject.value">{{ subject.label }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="courseTitle">Titre du cours *</label>
        <select
          id="courseTitle"
          [ngModel]="courseTitle()"
          (ngModelChange)="courseTitle.set($event)"
          name="courseTitle"
          [disabled]="!courseSubject()"
          required
        >
          <option value="" disabled selected>
            {{ courseSubject() ? 'Sélectionner un chapitre' : 'Choisissez d\'abord une matière' }}
          </option>
          @for (t of availableTitles(); track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="courseDescription">Description du cours</label>
        <textarea 
          id="courseDescription" 
          rows="3" 
          [ngModel]="courseDescription()" 
          (ngModelChange)="courseDescription.set($event)"
          name="courseDescription" 
          placeholder="Résumé des objectifs du cours..."
        ></textarea>
      </div>

      <!-- UPLOAD VIDÉOS ET PDF -->
      <div class="upload-grid">
        
        <!-- UPLOAD VIDÉOS -->
        <div class="upload-block">
          <label class="upload-label">🎬 Vidéos (MP4, MKV)</label>
          <input 
            type="file" 
            #videoInput 
            accept="video/*" 
            multiple 
            hidden 
            (change)="onFileSelected($event, 'video')" 
          />
          <button type="button" class="btn-upload" (click)="videoInput.click()">
            📁 Parcourir vidéos
          </button>

          <ul class="file-list">
            @for (v of videos(); track $index) {
              <li>
                <span class="file-name">🎬 {{ v.name }}</span>
                <button type="button" class="btn-remove-file" (click)="removeFile('video', $index)">✕</button>
              </li>
            }
          </ul>
        </div>

        <!-- UPLOAD PDF -->
        <div class="upload-block">
          <label class="upload-label">📄 Documents PDF</label>
          <input 
            type="file" 
            #pdfInput 
            accept="application/pdf" 
            multiple 
            hidden 
            (change)="onFileSelected($event, 'pdf')" 
          />
          <button type="button" class="btn-upload" (click)="pdfInput.click()">
            📁 Parcourir PDF
          </button>

          <ul class="file-list">
            @for (p of pdfs(); track $index) {
              <li>
                <span class="file-name">📄 {{ p.name }}</span>
                <button type="button" class="btn-remove-file" (click)="removeFile('pdf', $index)">✕</button>
              </li>
            }
          </ul>
        </div>

      </div>

    </section>

    <!-- ACTION PUBLIER -->
    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Envoi en cours...' : '🚀 Publier le cours' }}
      </button>
    </div>

  </form>
</div>
