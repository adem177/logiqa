<div class="card-container">
  <div class="header">
    <h2>LOGIQA ✨</h2>
    <p class="subtitle">Plateforme E-Learning</p>
  </div>

  <h3>Mot de passe oublié</h3>
  <p class="description">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>LOGIN / EMAIL</label>
      <input type="email" formControlName="email" placeholder="votre_email@gmail.com" />
    </div>

    <div *ngIf="message" class="alert success">{{ message }}</div>
    <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>

    <button type="submit" [disabled]="forgotForm.invalid || loading" class="btn-primary">
      {{ loading ? 'Envoi...' : 'Envoyer le lien' }}
    </button>
  </form>

  <div class="footer">
    <a routerLink="/login" class="back-link">← Retour à la connexion</a>
  </div>
</div>
