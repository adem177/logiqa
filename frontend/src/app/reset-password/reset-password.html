<div class="reset-container">
  <div class="reset-card">
    <div class="header">
      <h2>Nouveau mot de passe</h2>
      <p>Saisissez votre nouveau mot de passe pour sécuriser votre compte LOGIQA.</p>
    </div>

    <!-- Message de succès -->
    <div *ngIf="message" class="alert alert-success">
      {{ message }}
    </div>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!message">
      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          class="form-control"
          placeholder="Au moins 8 caractères, une lettre et un chiffre"
          [class.is-invalid]="resetForm.get('password')?.invalid && resetForm.get('password')?.touched"
        />
        <div *ngIf="resetForm.get('password')?.invalid && resetForm.get('password')?.touched" class="error-text">
          Le mot de passe doit contenir au moins 8 caractères, une lettre et un chiffre.
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="resetForm.invalid || loading">
        {{ loading ? 'Mise à jour en cours...' : 'Réinitialiser le mot de passe' }}
      </button>
    </form>

    <div class="footer">
      <a routerLink="/login" class="back-link">← Retour à la connexion</a>
    </div>
  </div>
</div>
